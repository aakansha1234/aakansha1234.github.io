.menu-bar > button { min-height: 20px; padding: 2px 7px; border: 1px solid transparent; background: transparent; box-shadow: none; }
.menu-bar > button:hover, .menu-bar > button[aria-expanded="true"] { background: #316ac5; color: #fff; }
.main-area { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; }

.tool-grid { display: grid; grid-template-columns: repeat(2, 24px); gap: 0; }

.tool-btn:hover { border-color: #fff #808080 #808080 #fff; }
.tool-btn.active, .tool-btn[aria-pressed="true"] { border-color: #808080 #fff #fff #808080; background: #f7f5eb; box-shadow: inset 1px 1px #b9b6ab; }
.tool-btn svg { display: block; width: 16px; height: 16px; }
.tool-options { min-height: 70px; width: 43px; margin: 9px auto 0; padding: 3px; border: 1px solid; border-color: #808080 #fff #fff #808080; }
.options-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
.tool-option { display: flex; align-items: center; justify-content: center; min-width: 0; width: 100%; min-height: 20px; padding: 2px; border: 1px solid transparent; box-shadow: none; }
.tool-option.active, .zoom-option.active { color: #fff; background: #0a246a; border-color: #0a246a; }
.line-sample { display: block; width: 28px; background: currentColor; }
.shape-sample { display: block; width: 27px; height: 15px; border: 1px solid currentColor; }
.selection-sample { display: block; width: 28px; height: 21px; border: 1px dashed currentColor; }
.zoom-option { display: block; width: 100%; min-height: 18px; padding: 1px; border: 0; box-shadow: none; }
.canvas-area { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 3px 10px 10px 3px; background: #808080; border-top: 1px solid #fff; border-left: 1px solid #fff; }
.canvas-wrapper { position: relative; display: inline-block; vertical-align: top; width: 800px; height: 600px; margin-right: 7px; margin-bottom: 7px; }
#canvas { display: block; width: 800px; height: 600px; background: #fff; cursor: crosshair; touch-action: none; }
#overlayCanvas, #gridOverlay { position: absolute; left: 0; top: 0; pointer-events: none; }
#overlayCanvas { width: 800px; height: 600px; }
.canvas-resize { position: absolute; z-index: 3; width: 5px; height: 5px; background: #fff; border: 1px solid #164da3; touch-action: none; }
.canvas-resize[data-resize="e"] { left: calc(100% + 1px); top: calc(50% - 2px); cursor: ew-resize; }
.canvas-resize[data-resize="s"] { left: calc(50% - 2px); top: calc(100% + 1px); cursor: ns-resize; }
.canvas-resize[data-resize="se"] { left: calc(100% + 1px); top: calc(100% + 1px); cursor: nwse-resize; }
#textEditor { position: absolute; z-index: 2; resize: none; margin: 0; padding: 0; border: 1px dashed #000; outline: none; overflow: hidden; border-radius: 0; }
.color-palette { display: flex; align-items: center; flex: 0 0 49px; gap: 5px; padding: 5px 4px; border-top: 1px solid #fff; overflow-x: auto; }
.current-colors { position: relative; width: 39px; height: 34px; flex-shrink: 0; border: 1px solid; border-color: #808080 #fff #fff #808080; background: repeating-conic-gradient(#fff 0% 25%, #c0c0c0 0% 50%) 0 0 / 4px 4px; }
.current-colors button { position: absolute; width: 20px; height: 20px; min-height: 0; padding: 0; border: 2px solid #ece9d8; box-shadow: 1px 1px #808080, -1px -1px #fff; }
#fgColor { top: 3px; left: 4px; background: #000; z-index: 1; }
#bgColor { bottom: 3px; right: 3px; background: #fff; }
.palette-grid { flex-shrink: 0; }
.palette-row { display: flex; gap: 2px; height: 16px; }
.palette-row button, .palette-row .color-swatch { width: 16px; height: 16px; min-height: 16px; padding: 0; border: 2px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 1px 1px #333; }
.palette-row button:focus-visible { outline: 1px dotted #fff; outline-offset: -4px; }
.status-bar { flex: 0 0 22px; display: flex; gap: 2px; padding: 2px; border-top: 1px solid #aca899; overflow: hidden; }
.status-bar > span { display: flex; align-items: center; min-width: 70px; padding: 1px 5px; border: 1px solid; border-color: #aca899 #fff #fff #aca899; white-space: nowrap; }
#statusInfo { flex: 1; min-width: 80px; overflow: hidden; }
#statusPos, #statusSelection { width: 113px; }
#statusSize { width: 104px; }
#statusZoom { min-width: 50px; width: 55px; }
#menuLayer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.dropdown[role="menu"] { position: fixed; pointer-events: auto; min-width: 190px; max-height: calc(100dvh - 4px); overflow-y: auto; padding: 2px; color: #000; background: #fff; border: 1px solid #aca899; box-shadow: 2px 2px 3px #0005; }
.menu-item { display: flex; align-items: center; gap: 7px; width: 100%; min-height: 22px; padding: 3px 5px 3px 2px; text-align: left; background: transparent; border: 0; box-shadow: none; white-space: nowrap; }
.menu-item:not(:disabled):hover, .menu-item:not(:disabled):focus { background: #316ac5; color: #fff; outline: none; }
.menu-item:disabled { color: #aca899; text-shadow: none; }
.menu-check { display: inline-flex; justify-content: center; width: 18px; flex-shrink: 0; }
.menu-item.checked .menu-check { background: #dce8fa; color: #000; border: 1px solid #316ac5; }
.menu-label { flex: 1; }
.shortcut { margin-left: 20px; }
.menu-arrow { margin-left: 6px; width: 8px; }
.menu-separator { height: 1px; margin: 3px 2px 3px 24px; background: #d0d0d0; border: 0; }
.floating-window { position: absolute; z-index: 15; padding: 2px; background: #ece9d8; border: 1px solid #0054e3; box-shadow: 2px 2px 4px #0005; }
.floating-title { display: flex; justify-content: space-between; align-items: center; height: 20px; padding: 2px 4px; background: linear-gradient(#2580ec, #0054df); color: #fff; font-weight: bold; cursor: move; }
.floating-title button { width: 16px; height: 16px; min-height: 16px; padding: 0; line-height: 12px; color: #fff; border-color: #fff; background: #d7472e; box-shadow: none; }
.text-toolbar { top: 85px; left: 95px; }
.font-controls { display: flex; align-items: center; gap: 3px; padding: 5px 3px; }
#fontFamily { width: 155px; }
#fontSize { width: 48px; }
.font-controls button { min-width: 24px; padding: 2px 5px; }
.thumbnail-panel { right: 24px; top: 95px; width: 210px; }
.thumbnail-content { padding: 3px; background: #808080; }
#thumbnailCanvas { display: block; max-width: 100%; height: auto; background: #fff; }
#paintDialog { padding: 0; min-width: 280px; max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px); overflow: auto; color: #000; background: #ece9d8; border: 3px solid #0054e3; border-top-width: 1px; border-radius: 5px 5px 0 0; box-shadow: 4px 5px 14px #0006; }
#paintDialog::backdrop { background: #0002; }
.dialog-title { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 27px; padding: 3px 4px; color: #fff; font-size: 12px; font-weight: bold; background: linear-gradient(#2580ec, #0054df); cursor: move; }
.dialog-close { width: 21px; min-height: 21px; padding: 0; border: 1px solid #fff; border-radius: 3px; color: #fff; background: #dc482c; box-shadow: inset 1px 1px #f7ad95; }
.dialog-body { padding: 14px 13px 9px; line-height: 1.45; }
.dialog-body p { margin: 0 0 10px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 7px; padding: 8px 12px 12px; }
.dialog-actions button { min-width: 75px; }
.dialog-actions button.primary { outline: 1px solid #000; outline-offset: 1px; }
.field-row { display: flex; align-items: center; gap: 9px; margin: 6px 0; }
.field-row > label:first-child { min-width: 75px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.field input, .field select { min-width: 0; }
.field-row input[type="number"] { width: 73px; }
.field-row input[type="text"] { flex: 1; min-width: 0; }
.group, fieldset { min-width: 0; margin: 8px 0; padding: 10px; border: 1px solid #aca899; }
.group > label { display: block; margin: 4px 0; }
legend { padding: 0 4px; }
.two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dialog-note { max-width: 420px; color: #555; line-height: 1.5; margin-top: 9px; }
.color-dialog-grid { display: grid; grid-template-columns: auto auto; align-items: start; gap: 16px; }
.basic-colors, .custom-colors, .color-grid { display: grid; grid-template-columns: repeat(8, 16px); gap: 5px; margin: 7px 0 12px; }
.basic-colors button, .custom-colors button, .color-grid button { width: 16px; height: 16px; min-height: 16px; padding: 0; border: 1px solid; border-color: #808080 #fff #fff #808080; box-shadow: inset 1px 1px #333; }
.basic-colors button.active, .custom-colors button.active, .color-grid button.active { outline: 1px solid #000; outline-offset: 2px; }
.color-advanced { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; width: 210px; }
.color-advanced canvas { display: block; touch-action: none; cursor: crosshair; border: 1px solid #808080; }
.color-values { display: grid; grid-template-columns: 50px 1fr; align-items: center; gap: 6px; width: 100%; }
.color-values > div:last-child { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 5px; }
.color-values label { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
.color-values label:nth-child(-n+3) { grid-column: 1; }
.color-values label:nth-child(n+4) { grid-column: 2; }
.color-values label:nth-child(3n+1) { grid-row: 1; }
.color-values label:nth-child(3n+2) { grid-row: 2; }
.color-values label:nth-child(3n+3) { grid-row: 3; }
.color-values input { width: 36px; min-width: 0; padding: 2px; }
.color-preview { width: 50px; height: 50px; border: 1px solid; border-color: #808080 #fff #fff #808080; }
.help-tabs { display: flex; flex-wrap: wrap; gap: 2px; max-width: 540px; margin-bottom: -1px; }
.help-tabs button { border-bottom: 0; }
.help-tabs button.active { background: #fff; }
.help-content { max-width: 540px; max-height: 360px; overflow: auto; padding: 12px; background: #fff; border: 1px solid #aca899; user-select: text; }
.help-content h2 { margin-top: 0; font-size: 13px; }
.help-content li { margin: 5px 0; }
.print-preview { position: fixed; inset: 0; z-index: 80; overflow: auto; background: #808080; }
.preview-toolbar { position: sticky; top: 0; display: flex; gap: 7px; padding: 6px; background: #ece9d8; border-bottom: 1px solid #555; }
.preview-page { width: fit-content; max-width: calc(100% - 40px); margin: 20px auto; padding: 35px; background: #fff; box-shadow: 2px 3px 5px #333; }
#printPreviewImage { display: block; max-width: 100%; height: auto; }
.restore-app { position: fixed; left: 8px; bottom: 8px; min-width: 160px; text-align: left; font-weight: bold; }
.closed-screen { display: grid; place-content: center; justify-items: center; gap: 8px; width: 100%; height: 100%; color: #fff; }
.closed-screen p { margin: 0; }
.bitmap-view { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center; background: #000; }
.bitmap-view img { max-width: 100%; max-height: 100%; object-fit: contain; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#printOutput { display: none; }
@media (max-width: 600px) {
    #statusSelection { display: none; }
    .status-bar > span { min-width: 45px; }
    #statusPos, #statusSize { width: 78px; }
    .text-toolbar { left: 65px; max-width: calc(100% - 70px); }
    .font-controls { flex-wrap: wrap; }
    .color-dialog-grid { grid-template-columns: 1fr; gap: 10px; }
    .dialog-body { padding: 10px; }
    .two-column { grid-template-columns: 1fr; gap: 8px; }
}
@media print {
    :root, body { background: #fff; height: auto; overflow: visible; }
    body > * { display: none !important; }
    body > #printOutput { display: block !important; }
    .print-sheet { break-after: page; page-break-after: always; overflow: hidden; }
    .print-sheet:last-child { break-after: auto; page-break-after: auto; }
    .print-sheet img, .print-sheet canvas { display: block; }
}

    <script>

    canvas.height = height;

        brushShape: 'round', shapeStyle: 'outline', transparent: false,
        fontFamily: 'Arial', fontSize: 16, bold: false, italic: false, underline: false,
        zoom: 1, grid: false
      };
      this.past = [];
      this.future = [];
      this.revision = 0;
      this.nextRevision = 1;
      this.savedRevision = 0;
      this.selection = null;
      this.pending = null;
      this.drag = null;
      this.editor = null;
      this.sprayTimer = null;
      this.previousTool = 'pencil';
      this.colorCache = new Map();
      this.ctx.fillStyle = this.options.bg;
      this.ctx.fillRect(0, 0, canvas.width, canvas.height);

      canvas.addEventListener('pointerdown', event => this._guard(() => this._down(event)));

      canvas.addEventListener('pointerup', event => this._guard(() => this._up(event)));

      });

        if (!this.drag) this._emit('position', null);
      });

        if (this.pending?.kind === 'polygon') {
          event.preventDefault();
          this.commit();
        }
      });
      for (const handle of wrapper.querySelectorAll('[data-resize]')) {
        handle.addEventListener('pointerdown', event => this._guard(() => this._resizeDown(event, handle)));
      }
      this._layout();
      this._change();
    }

    _guard(action) {
      try { action(); } catch (error) {
        this._stopSpray();
        this._emit('status', error.message || String(error));
      }
    }

    _emit(type, detail) { this.dispatchEvent(new CustomEvent(type, { detail })); }
    _change() { this._emit('change', this.getState()); }
    _touch() { this.revision = this.nextRevision++; }
    _validate(width, height) {
      if (!Number.isFinite(width) || !Number.isFinite(height) || width < 1 || height < 1 || width > MAX_DIMENSION || height > MAX_DIMENSION || width * height > MAX_PIXELS) {
        throw new Error('Image dimensions must be 1–8192 pixels, with no more than 16,777,216 pixels in total.');
      }
    }
    _color(value) {

        const context = makeCanvas(1, 1).getContext('2d');
        context.fillStyle = value;
        context.fillRect(0, 0, 1, 1);
        this.colorCache.set(value, Array.from(context.getImageData(0, 0, 1, 1).data));
      }

    }
    _selectionSnapshot(selection) {
      if (!selection) return null;
      const { keyCache, ...state } = selection;
      return { ...state, image: cloneCanvas(selection.image), origin: selection.origin };
    }
    _snapshot() {
      return {
        width: this.canvas.width, height: this.canvas.height,
        pixels: this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height),
        selection: this._selectionSnapshot(this.selection), revision: this.revision

    }
    _trimHistory() {

      const totalBytes = () => {
        const seen = new Set();
        const visit = snapshot => {
          if (!snapshot || seen.has(snapshot)) return 0;
          seen.add(snapshot);
          let bytes = snapshot.pixels.data.byteLength;
          if (snapshot.selection) {
            bytes += snapshot.selection.image.width * snapshot.selection.image.height * 4;
            bytes += visit(snapshot.selection.origin);

        };

      while (this.past.length > 1 && (totalBytes() > HISTORY_BYTES || this.past.length > 40)) this.past.shift();

    _checkpoint(snapshot) {

      this.canvas.height = snapshot.height;
      this.ctx.putImageData(snapshot.pixels, 0, 0);

      this.revision = snapshot.revision;
      this._layout();
      this._change();

        revision: this.revision,
        dirty: this.revision !== this.savedRevision || !!this.editor?.value || !!this.pending,
        canUndo: this.past.length > 0 || !!this.pending || !!this.editor?.value,
        canRedo: this.future.length > 0,
        hasSelection: !!this.selection,
        selectionWidth: this.selection ? this.selection.width : 0,
        selectionHeight: this.selection ? this.selection.height : 0,
        textEditing: !!this.editor
      };
    }
    setTool(tool) {
      if (!TOOLS.has(tool)) throw new Error('Unknown drawing tool.');
      if (tool === this.options.tool) return;
      this.commit();
      if (!['picker', 'magnifier'].includes(this.options.tool)) this.previousTool = this.options.tool;
      this.options.tool = tool;
      this.canvas.style.cursor = ['selectRect', 'lasso'].includes(tool) ? 'crosshair' : tool === 'text' ? 'text' : 'crosshair';
      const hints = {
        curve: 'Drag a line, then drag twice to bend it. Enter finishes; Escape cancels.',
        polygon: 'Drag the first edge, then click vertices. Click the first corner, double-click, or press Enter to finish.',
        lasso: 'Draw a free-form selection. Drag inside to move; Shift-drag makes a copy.',
        selectRect: 'Drag a selection. Use its eight handles to resize; Shift-drag makes a copy.',
        text: 'Drag a text box and type. Ctrl+Enter finishes; Escape cancels.',
        magnifier: 'Click to zoom in; right-click to zoom out.'

      this._change();
    }
    setColors(fg, bg) {
      if (fg !== undefined) this.options.fg = fg;
      if (bg !== undefined) this.options.bg = bg;
      if (this.editor) this.textBox.color = this.options[this.textBox.colorSource];
      this._styleEditor();
      this._render();
      this._change();
    }
    setOptions(partial) {
      if (partial.tool !== undefined) this.setTool(partial.tool);
      if (partial.zoom !== undefined) this.setZoom(partial.zoom);
      const next = { ...this.options };
      for (const key of ['size', 'lineWidth', 'brushShape', 'shapeStyle', 'transparent', 'fontFamily', 'fontSize', 'bold', 'italic', 'underline', 'grid']) {
        if (partial[key] !== undefined) next[key] = partial[key];
      }
      if (!['round', 'square', 'slash', 'backslash'].includes(next.brushShape)) throw new Error('Invalid brush shape.');
      if (!['outline', 'filled-outline', 'filled'].includes(next.shapeStyle)) throw new Error('Invalid shape style.');

      this._render();
      this._change();
    }
    setZoom(zoom, focus) {

      const anchor = focus || { x: (this.area.scrollLeft + this.area.clientWidth / 2) / previous, y: (this.area.scrollTop + this.area.clientHeight / 2) / previous };
      const viewX = anchor.x * previous - this.area.scrollLeft;
      const viewY = anchor.y * previous - this.area.scrollTop;
      this.options.zoom = zoom;
      this._layout();
      this.area.scrollLeft = anchor.x * zoom - viewX;
      this.area.scrollTop = anchor.y * zoom - viewY;

    }

      this.overlay.height = height;
      this.ctx.imageSmoothingEnabled = false;
      this.overlayCtx.imageSmoothingEnabled = false;
      for (const canvas of [this.canvas, this.overlay]) {

        canvas.style.height = `${height * zoom}px`;
        canvas.style.imageRendering = 'pixelated';
      }

      this.wrapper.style.height = `${height * zoom}px`;
      this._styleEditor();
      this._render();
    }
    _point(event) {
      const rect = this.canvas.getBoundingClientRect();
      return { x: Math.floor((event.clientX - rect.left) * this.canvas.width / rect.width), y: Math.floor((event.clientY - rect.top) * this.canvas.height / rect.height) };
    }
    _inside(point) { return point.x >= 0 && point.y >= 0 && point.x < this.canvas.width && point.y < this.canvas.height; }
    _constrain(start, point, square = false) {
      const dx = point.x - start.x, dy = point.y - start.y;
      if (square) {
        const size = Math.max(Math.abs(dx), Math.abs(dy));
        return { x: start.x + (dx < 0 ? -size : size), y: start.y + (dy < 0 ? -size : size) };

      const angle = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
      const distance = Math.hypot(dx, dy);
      return { x: Math.round(start.x + Math.cos(angle) * distance), y: Math.round(start.y + Math.sin(angle) * distance) };
    }
    _box(start, end) { return { x: Math.min(start.x, end.x), y: Math.min(start.y, end.y), width: Math.max(1, Math.abs(end.x - start.x)), height: Math.max(1, Math.abs(end.y - start.y)) }; }

      const tool = this.options.tool;

      if (tool === 'picker') {
        const image = this.getImage().getContext('2d').getImageData(point.x, point.y, 1, 1).data;
        const color = `#${Array.from(image.slice(0, 3), byte => byte.toString(16).padStart(2, '0')).join('')}`;

        const zoom = this.options.zoom;
        const next = event.button === 2 ? [...levels].reverse().find(value => value < zoom) || levels[0] : levels.find(value => value > zoom) || 16;
        this.setZoom(next, point);
        return;
      }
      this._capture(event);
      if (this.selection) {
        const handle = this._selectionHit(point);
        if (handle) {
          const before = this._snapshot();
          if (event.shiftKey && handle === 'move') this.ctx.drawImage(this._effectiveSelection(), this.selection.x, this.selection.y, this.selection.width, this.selection.height);
          this.drag = { kind: 'selection', start: point, last: point, handle, selection: { ...this.selection }, before, changed: !!event.shiftKey };
          this._render();
          return;
        }
        this.deselect();
      }
      const color = event.button === 2 ? this.options.bg : this.options.fg;
      if (tool === 'fill') { this._fill(point, color); return; }
      if (this.pending?.kind === 'curve' && tool === 'curve') {
        this.drag = { kind: 'bend', start: point, last: point };
        this.pending[this.pending.stage === 1 ? 'c1' : 'c2'] = point;
        this._render();
        return;
      }
      if (this.pending?.kind === 'polygon' && tool === 'polygon') {
        const first = this.pending.points[0];
        if (this.pending.points.length > 2 && Math.hypot(point.x - first.x, point.y - first.y) <= 5 / this.options.zoom) {
          this._finishPending(); this._render(); this._change(); return;
        }
        const previous = this.pending.points[this.pending.points.length - 1];
        const vertex = event.shiftKey ? this._constrain(previous, point) : point;
        this.pending.points.push(vertex);
        this.pending.hover = vertex;
        this.drag = { kind: 'polygonVertex', start: previous, last: vertex };
        this._render();
        return;
      }
      const before = this._snapshot();
      if (['pencil', 'brush', 'eraser', 'airbrush'].includes(tool)) {
        this.drag = { kind: 'stroke', tool, start: point, last: point, before, right: event.button === 2, color };
        this._stroke(point, point);
        if (tool === 'airbrush') this.sprayTimer = setInterval(() => {
          if (this.drag?.kind === 'stroke') { this._spray(this.drag.last, this.drag.color); this._change(); }
        }, 35);
      } else if (tool === 'selectRect' || tool === 'lasso') {
        this.drag = { kind: 'select', tool, start: point, last: point, points: [point], before };
      } else if (tool === 'text') {
        this.drag = { kind: 'textBox', start: point, last: point, color, right: event.button === 2 };
      } else if (tool === 'curve') {
        this.pending = { kind: 'curve', p0: point, p3: point, c1: point, c2: point, stage: 0, color, before };
        this.drag = { kind: 'curveLine', start: point, last: point };
      } else if (tool === 'polygon') {
        this.pending = { kind: 'polygon', points: [point, point], hover: point, color, before };
        this.drag = { kind: 'polygonFirst', start: point, last: point };
      } else {
        this.drag = { kind: 'shape', tool, start: point, last: point, color, before };
      }
      this._render();
    }
    _move(event) {
      let point = this._point(event);
      this._emit('position', this._inside(point) ? point : null);

        if (this.pending?.kind === 'polygon') { this.pending.hover = point; this._render(); }

      }

      if (event.shiftKey && ['shape', 'curveLine', 'polygonFirst', 'polygonVertex'].includes(drag.kind)) point = this._constrain(drag.start, point, ['rect', 'ellipse', 'roundRect'].includes(drag.tool));
      if (drag.kind === 'stroke') {
        if (event.shiftKey) {
          point = this._constrain(drag.start, point);
          this.ctx.putImageData(drag.before.pixels, 0, 0);

        drag.points.push(point);
      } else if (drag.kind === 'selection') {
        this._dragSelection(point, event.shiftKey);
      } else if (drag.kind === 'curveLine') {
        this.pending.p3 = point;
        this.pending.c1 = { x: drag.start.x + (point.x - drag.start.x) / 3, y: drag.start.y + (point.y - drag.start.y) / 3 };
        this.pending.c2 = { x: drag.start.x + (point.x - drag.start.x) * 2 / 3, y: drag.start.y + (point.y - drag.start.y) * 2 / 3 };
      } else if (drag.kind === 'bend') {
        this.pending[this.pending.stage === 1 ? 'c1' : 'c2'] = point;
      } else if (drag.kind === 'polygonFirst') {
        this.pending.points[1] = point;
        this.pending.hover = point;
      } else if (drag.kind === 'polygonVertex') {
        this.pending.points[this.pending.points.length - 1] = point;
        this.pending.hover = point;
      }
      drag.last = point;
      this._render();
    }
    _up(event) {
      if (!this.drag) return;
      this._move(event);
      const drag = this.drag;
      drag.ending = true;
      this._stopSpray();
      if (drag.kind === 'stroke') {
        this._checkpoint(drag.before);
        this._touch();
      } else if (drag.kind === 'shape') {
        this._checkpoint(drag.before);
        this._drawShape(this.ctx, drag.tool, drag.start, drag.last, drag.color);
        this._touch();
      } else if (drag.kind === 'select') {
        this._makeSelection(drag);
      } else if (drag.kind === 'selection') {
        if (drag.changed) { this._checkpoint(drag.before); this._touch(); this.selection.changed = true; }
      } else if (drag.kind === 'textBox') {
        const box = this._box(drag.start, drag.last);
        if (box.width < 10) box.width = Math.min(240, this.canvas.width - box.x);
        if (box.height < 10) box.height = Math.min(100, this.canvas.height - box.y);
        this._startText(box, drag.color, drag.right);
      } else if (drag.kind === 'curveLine') {
        this.pending.stage = 1;
      } else if (drag.kind === 'bend') {
        if (this.pending.stage === 2) this._finishPending();
        else this.pending.stage = 2;
      }
      this.drag = null;
      if (this.canvas.hasPointerCapture(event.pointerId)) this.canvas.releasePointerCapture(event.pointerId);
      this._render();
      this._change();
    }
    _stopSpray() { clearInterval(this.sprayTimer); this.sprayTimer = null; }
    _stroke(start, end) {
      const drag = this.drag;
      if (drag.tool === 'airbrush') { this._spray(end, drag.color); return; }
      if (drag.tool === 'eraser' && drag.right) { this._replaceStroke(start, end); return; }
      const size = drag.tool === 'pencil' ? 1 : this.options.size;
      const color = drag.tool === 'eraser' ? this.options.bg : drag.color;
      const shape = drag.tool === 'eraser' ? 'square' : drag.tool === 'pencil' ? 'round' : this.options.brushShape;
      const distance = Math.hypot(end.x - start.x, end.y - start.y);
      const steps = Math.max(1, Math.ceil(distance / Math.max(0.5, size / 5)));
      const context = this.ctx;
      context.fillStyle = color;
      context.strokeStyle = color;
      for (let step = 0; step <= steps; step++) {

    }
    async function editColors(target = 'fg', slot = null) {

        let rgb = [1, 3, 5].map(index => parseInt(hex.slice(index, index + 2), 16)), hsl = rgbToHsl(...rgb), customIndex = 0;
        const basics = ['#ff8080','#ffff80','#80ff80','#00ff80','#80ffff','#0080ff','#ff80c0','#ff80ff','#ff0000','#ffff00','#80ff00','#00ff40','#00ffff','#0080c0','#8080c0','#ff00ff','#804040','#ff8040','#00ff00','#008080','#004080','#8080ff','#800040','#ff0080','#800000','#ff8000','#008000','#008040','#0000ff','#0000a0','#800080','#8000ff','#400000','#804000','#004000','#004040','#000080','#000040','#400040','#400080','#000000','#808000','#808040','#808080','#408080','#c0c0c0','#400040','#ffffff'];

        const result = await dialog('Edit Colors', `<div class="color-dialog-grid"><div><p>Basic colors:</p><div class="basic-colors">${swatches(basics, 'basic')}</div><p>Custom colors:</p><div class="custom-colors">${swatches(customColors, 'custom')}</div><button type="button" id="defineColors">Define Custom Colors &gt;&gt;</button></div><div class="color-advanced" hidden><div style="display:flex;gap:8px"><canvas id="colorSpectrum" width="180" height="160" aria-label="Hue and saturation" tabindex="0"></canvas><canvas id="colorLuminosity" width="16" height="160" aria-label="Luminosity" tabindex="0"></canvas></div><div class="color-values"><div class="color-preview" id="colorPreview"></div><div>${[['h','Hue',239],['s','Sat',240],['l','Lum',240],['r','Red',255],['g','Green',255],['b','Blue',255]].map(([name,label,max]) => `<label>${label}:<input type="number" name="${name}" min="0" max="${max}" aria-label="${label}"></label>`).join('')}</div></div><button type="button" id="addCustom">Add to Custom Colors</button></div></div>`, {
            className: 'edit-colors-dialog',
            setup: form => {
                const update = () => {
                    hex = '#' + rgb.map(value => value.toString(16).padStart(2, '0')).join('');
                    $('colorPreview').style.backgroundColor = hex;
                    for (const [index, name] of ['r','g','b'].entries()) form.elements[name].value = rgb[index];
                    for (const [index, name] of ['h','s','l'].entries()) form.elements[name].value = Math.round(hsl[index] * (index === 0 ? 239 / 360 : 2.4));
                    const spectrum = $('colorSpectrum').getContext('2d'), hue = spectrum.createLinearGradient(0, 0, 180, 0);
                    for (let i = 0; i <= 6; i++) hue.addColorStop(i / 6, `hsl(${i * 60} 100% 50%)`);
                    spectrum.fillStyle = hue; spectrum.fillRect(0, 0, 180, 160);
                    const saturation = spectrum.createLinearGradient(0, 0, 0, 160); saturation.addColorStop(0, 'rgba(128,128,128,0)'); saturation.addColorStop(1, '#808080'); spectrum.fillStyle = saturation; spectrum.fillRect(0, 0, 180, 160);
                    const x = hsl[0] / 360 * 180, y = (1 - hsl[1] / 100) * 160;
                    spectrum.strokeStyle = '#fff'; spectrum.lineWidth = 3; spectrum.strokeRect(x - 3, y - 3, 6, 6); spectrum.strokeStyle = '#000'; spectrum.lineWidth = 1; spectrum.strokeRect(x - 3, y - 3, 6, 6);
                    const lum = $('colorLuminosity').getContext('2d'), gradient = lum.createLinearGradient(0, 0, 0, 160); gradient.addColorStop(0, '#fff'); gradient.addColorStop(.5, `hsl(${hsl[0]} ${hsl[1]}% 50%)`); gradient.addColorStop(1, '#000'); lum.fillStyle = gradient; lum.fillRect(0, 0, 16, 160); lum.strokeStyle = hsl[2] > 50 ? '#000' : '#fff'; lum.strokeRect(.5, (1 - hsl[2] / 100) * 159, 15, 1);
                };
                const select = color => { rgb = [1,3,5].map(index => parseInt(color.slice(index,index+2),16)); hsl = rgbToHsl(...rgb); update(); };
                form.querySelectorAll('[data-basic]').forEach(button => button.addEventListener('click', () => select(basics[Number(button.dataset.basic)])));
                form.querySelectorAll('[data-custom]').forEach(button => button.addEventListener('click', () => { customIndex = Number(button.dataset.custom); select(customColors[customIndex]); form.querySelectorAll('[data-custom]').forEach(el => el.classList.toggle('active', el === button)); }));

                for (const name of ['r','g','b','h','s','l']) form.elements[name].addEventListener('input', () => {
                    if (!form.elements[name].value || !form.elements[name].validity.valid) return;
                    if (['r','g','b'].includes(name)) { rgb = ['r','g','b'].map(key => Number(form.elements[key].value)); hsl = rgbToHsl(...rgb); }
                    else { hsl = ['h','s','l'].map((key,index) => Number(form.elements[key].value) / (index === 0 ? 239 / 360 : 2.4)); rgb = hslToRgb(...hsl); }

                }

            }
        });
        if (result.action === 'ok') { if (slot) { palette[slot.row][slot.column] = hex; buildPalette(); } const state = editor.getState(); editor.setColors(target === 'fg' ? hex : state.fg, target === 'bg' ? hex : state.bg); }
    }

    function drawThumbnail() {
        const image = editor.getImage(), canvas = $('thumbnailCanvas'), scale = Math.min(180 / image.width, 130 / image.height, 1);
        canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale));
        const context = canvas.getContext('2d'); context.imageSmoothingEnabled = false; context.drawImage(image, 0, 0, canvas.width, canvas.height);
    }
    function toggleView(key) {
        view[key] = !view[key];
        const ids = { tools: 'toolPanel', colors: 'colorPalette', status: 'statusBar', thumbnail: 'thumbnailPanel' };
        if (ids[key]) $(ids[key]).hidden = !view[key];
        render(editor.getState());
    }
    $('thumbnailClose').addEventListener('click', () => { view.thumbnail = false; $('thumbnailPanel').hidden = true; updateMenuStates(); });
    function bitmapView() {
        editor.commit(); const overlay = document.createElement('div'); overlay.id = 'bitmapView'; overlay.className = 'bitmap-view'; overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-label', 'View Bitmap. Press Escape or click to return.'); overlay.tabIndex = 0;
        Object.assign(overlay.style, { position: 'fixed', inset: '0', zIndex: 5000, background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'zoom-out' });
        const image = new Image(); image.src = editor.getImage().toDataURL(); image.alt = 'Current picture'; Object.assign(image.style, { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', imageRendering: 'pixelated' }); overlay.append(image); overlay.addEventListener('click', () => overlay.remove()); document.body.append(overlay); overlay.focus();
    }
    async function pageSetup() {
        const result = await dialog('Page Setup', `<div class="two-column"><fieldset class="group"><legend>Paper</legend><label class="field-row">Size:<select name="paper"><option value="A4" ${page.paper === 'A4' ? 'selected' : ''}>A4 (210 × 297 mm)</option><option value="Letter" ${page.paper === 'Letter' ? 'selected' : ''}>Letter (8½ × 11 in)</option><option value="Legal" ${page.paper === 'Legal' ? 'selected' : ''}>Legal (8½ × 14 in)</option></select></label><label class="field-row">Orientation:<select name="orientation"><option value="portrait" ${page.orientation === 'portrait' ? 'selected' : ''}>Portrait</option><option value="landscape" ${page.orientation === 'landscape' ? 'selected' : ''}>Landscape</option></select></label></fieldset><fieldset class="group"><legend>Margins (millimeters)</legend>${['left','right','top','bottom'].map(key => `<label class="field-row">${key[0].toUpperCase()+key.slice(1)}:<input type="number" min="0" max="100" step="0.1" name="${key}" value="${page[key]}" required></label>`).join('')}</fieldset></div><fieldset class="group"><legend>Centering</legend><label><input type="checkbox" name="centerH" ${page.centerH ? 'checked' : ''}> Horizontal</label><label><input type="checkbox" name="centerV" ${page.centerV ? 'checked' : ''}> Vertical</label></fieldset><fieldset class="group"><legend>Scaling</legend><label><input type="radio" name="mode" value="scale" ${page.mode === 'scale' ? 'checked' : ''}> Adjust to <input aria-label="Print scale" type="number" name="scale" min="10" max="500" value="${page.scale}" required> % normal size</label><label><input type="radio" name="mode" value="fit" ${page.mode === 'fit' ? 'checked' : ''}> Fit to <input aria-label="Pages across" type="number" name="across" min="1" max="10" value="${page.across}" required> by <input aria-label="Pages down" type="number" name="down" min="1" max="10" value="${page.down}" required> page(s)</label></fieldset>`, { validate: values => {
            const [w,h] = paperSize(values.paper,values.orientation); return Number(values.left)+Number(values.right) >= w - 10 || Number(values.top)+Number(values.bottom) >= h - 10 ? 'The margins must leave room for the picture.' : null;
        } });
        if (result.action === 'ok') { for (const key of Object.keys(page)) page[key] = ['centerH','centerV'].includes(key) ? key in result.values : ['paper','orientation','mode'].includes(key) ? result.values[key] : Number(result.values[key]); }
    }
    function paperSize(paper, orientation) { const size = ({ A4: [210,297], Letter: [215.9,279.4], Legal: [215.9,355.6] })[paper]; return orientation === 'landscape' ? [size[1],size[0]] : size; }
    function printLayout() {
        editor.commit(); const image = editor.getImage(), [paperW,paperH] = paperSize(page.paper,page.orientation), pxPerMM = 96 / 25.4;

        const scale = page.mode === 'fit' ? Math.min(width*page.across/image.width,height*page.down/image.height) : page.scale/100;
        const columns = Math.max(1,Math.ceil(image.width*scale/width-1e-8)), rows = Math.max(1,Math.ceil(image.height*scale/height-1e-8));
        if (columns*rows > 100) throw new Error('This print job exceeds 100 pages. Reduce the scale or use Fit to.');

            const canvas=document.createElement('canvas'); canvas.width=Math.ceil(paperW*pxPerMM);canvas.height=Math.ceil(paperH*pxPerMM);
            const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
            const dw=sw*scale,dh=sh*scale,dx=page.left*pxPerMM+(page.centerH?(width-dw)/2:0),dy=page.top*pxPerMM+(page.centerV?(height-dh)/2:0);
            context.drawImage(image,sx,sy,sw,sh,dx,dy,dw,dh);tiles.push(canvas.toDataURL('image/png'));
        }
        return {tiles,paperW,paperH};
    }
    function showPrintPreview() { const layout=printLayout(); previewPages=layout.tiles;previewIndex=0;$('printPreview').hidden=false;updatePreview();$('printPreviewClose').focus(); }
    function updatePreview() { $('printPreviewImage').src=previewPages[previewIndex];$('previewPageInfo').textContent=`Page ${previewIndex+1} of ${previewPages.length}`;$('previewPrevious').disabled=previewIndex===0;$('previewNext').disabled=previewIndex===previewPages.length-1; }
    const previewNav=document.createElement('span');previewNav.innerHTML='<button type="button" id="previewPrevious">Previous</button> <span id="previewPageInfo"></span> <button type="button" id="previewNext">Next</button>';$('printPreviewClose').parentElement.append(previewNav);
    $('previewPrevious').addEventListener('click',()=>{previewIndex--;updatePreview();});$('previewNext').addEventListener('click',()=>{previewIndex++;updatePreview();});
    $('printPreviewClose').addEventListener('click',()=>{$('printPreview').hidden=true;});$('printPreviewPrint').addEventListener('click',()=>run(printImage));
    function printImage() {
        const layout=printLayout();let output=$('printOutput');if(!output){output=document.createElement('div');output.id='printOutput';document.body.append(output);}

        style.textContent=`#printOutput{display:none}@media print{@page{size:${layout.paperW}mm ${layout.paperH}mm;margin:0}html,body{display:block!important;height:auto!important;overflow:visible!important;background:white!important}body> :not(#printOutput){display:none!important}#printOutput{display:block!important}.print-sheet{display:block!important;width:${layout.paperW}mm;height:${layout.paperH}mm;break-after:page;page-break-after:always}.print-sheet:last-child{break-after:auto;page-break-after:auto}}`;

    async function help() {
        const topics={
            'Drawing tools':'Pencil draws one-pixel lines. Brush offers round, square, and diagonal tips. Airbrush sprays continuously while the pointer is held down. Eraser paints with the background color; the right-button eraser replaces only the foreground color. Fill colors a connected area. The color picker returns to your previous drawing tool.',
            'Lines and shapes':'Drag to draw lines, rectangles, ellipses, or rounded rectangles. Hold Shift to constrain proportions and line angles. Select outline, outline with background fill, or solid foreground fill in the tool options. For a curve, draw the line, then drag twice to bend it. For a polygon, drag the first edge, click more corners, then click the first corner, double-click, or press Enter to finish. Escape cancels an unfinished shape.',
            'Selections':'Drag a rectangle or free-form outline to select pixels. Drag inside to move; drag one of eight handles to resize. Arrow keys move one pixel, Shift+arrows move ten. Shift-drag leaves a copy behind. Transparent selection hides pixels that match the current background color. Delete clears with the background color. Escape cancels an uncommitted move. Use Image > Crop to crop to the selection.',
            'Text':'Select Text, drag a box, and type. Drag its border to move it, or use its eight handles to resize while editing. The floating Fonts toolbar changes font, size, bold, italic, and underline. Tool options choose an opaque or transparent background. Click outside or press Ctrl+Enter to finish. Escape cancels. Once committed, text becomes pixels, as in classic Paint.',
            'Colors and zoom':'Left-click a palette color for the foreground; right-click for the background. Double-click a swatch to edit it. The overlapping color boxes also open Edit Colors. The magnifier and View > Zoom change magnification without changing image pixels. The grid is available at 400% or higher. Show Thumbnail displays an overview.',
            'Files and printing':'Open or drop an image to replace the document; Shift-drop pastes it. Save As downloads PNG, JPEG, or 24-bit BMP. Edit > Copy To saves the selection; Paste From loads an image into a movable selection. Browser permissions govern the system clipboard; the internal clipboard works within Paint. Page Setup, Print Preview, and Print use your browser printer. This single HTML file works offline. Desktop wallpaper, scanners, and email integration require operating-system access and are unavailable here.',
            'Keyboard shortcuts':'Ctrl (or ⌘ on Mac): N New, O Open, S Save, Shift+S Save As, Z Undo, Y / Shift+Z Redo, X Cut, C Copy, V Paste, A Select All, R Flip/Rotate, W Stretch/Skew, I Invert, E Attributes, Shift+X Crop, Shift+N Clear Image, P Print, G Grid, T Tool Box, L Color Box, F View Bitmap. Ctrl+PgUp 100%, Ctrl+PgDn 400%. Delete clears a selection. F1 opens Help. Alt+F/E/V/I/C/H opens the corresponding menu. Escape closes a menu or cancels an unfinished operation.',
            'Browser limits':'Images are limited to 8,192 pixels per side and 16,777,216 pixels total. Undo stores up to 40 steps within a 64 MiB history budget, retaining at least one step. Save downloads a new file; it does not overwrite an opened file. System clipboard access depends on browser permission; copying and pasting within Paint also works without it. Browser-reserved shortcuts may take precedence. Window controls operate within this page. Fonts and curve antialiasing follow the browser rather than Windows GDI.'
        };
        await dialog('Paint Help',`<div class="help-tabs">${Object.keys(topics).map((name,index)=>`<button type="button" data-topic="${index}" class="${index===0?'active':''}">${escapeHTML(name)}</button>`).join('')}</div><div class="help-content" tabindex="0">${escapeHTML(Object.values(topics)[0])}</div>`,{buttons:[{label:'Close',value:'ok',primary:true}],className:'help-dialog',setup:form=>form.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>{form.querySelector('.help-content').textContent=Object.values(topics)[Number(button.dataset.topic)];form.querySelectorAll('[data-topic]').forEach(candidate=>candidate.classList.toggle('active',candidate===button));}))});
    }
    async function perform(action) {
        if (!enabled(action)) return;
        switch(action) {
            case 'new': if(await confirmDiscard()){documentGeneration++;editor.newDocument();filename='untitled';format='png';render(editor.getState());report('For Help, click Help Topics on the Help Menu.');}break;
            case 'open':$('fileInput').click();break;
            case 'save':return save();case 'saveAs':return save(true);case 'copyTo':return save(true,true);
            case 'undo':editor.undo();break;case 'redo':editor.redo();break;
            case 'cut':return copy(true);case 'copy':return copy();case 'paste':return paste();case 'pasteFrom':$('pasteInput').click();break;
            case 'delete':editor.deleteSelection();break;case 'selectAll':editor.selectAll();break;
            case 'rotate':return rotateDialog();case 'stretch':return stretchDialog();case 'attributes':return attributesDialog();
            case 'invert':editor.invert();break;case 'clear':editor.clear();break;case 'crop':editor.crop();break;
            case 'opaque':editor.setOptions({transparent:!editor.getState().transparent});break;
            case 'tools':case 'colors':case 'status':case 'fonts':case 'thumbnail':toggleView(action);break;
            case 'zoomNormal':editor.setZoom(1);break;case 'zoomLarge':editor.setZoom(4);break;case 'zoomCustom':return zoomDialog();
            case 'grid':editor.setGrid(!editor.getState().grid);break;case 'bitmap':bitmapView();break;
            case 'editColors':return editColors();case 'pageSetup':return pageSetup();case 'printPreview':showPrintPreview();break;case 'print':printImage();break;
            case 'help':return help();case 'about':return dialog('About Paint','<h2>Paint</h2><p>Classic Windows XP-style bitmap editor</p><p>A self-contained browser recreation of the classic Paint interface and drawing workflow. Not a Microsoft product.</p><p class="dialog-note">PNG, JPEG and 24-bit BMP export · Offline editing · Keyboard and pointer support</p>',{buttons:[{label:'OK',value:'ok',primary:true}]});
            case 'exit':if(await confirmDiscard()){$('paintWindow').hidden=true;$('closedScreen').hidden=false;}break;
        }
    }
    function isEditing(target) { return !!target?.closest('input,textarea,select,[contenteditable="true"]'); }
    document.addEventListener('keydown',event=>{
        if($('paintDialog').open)return;
        if($('bitmapView')){if(event.key==='Escape'){event.preventDefault();$('bitmapView').remove();}return;}
        if(!$('printPreview').hidden){if(event.key==='Escape'){$('printPreview').hidden=true;event.preventDefault();}return;}
        if($('paintWindow').hidden)return;
        const key=event.key.toLowerCase(),command=event.ctrlKey||event.metaKey;
        if(isEditing(event.target)){if(event.target.id==='textEditor'&&event.key==='Escape'){event.preventDefault();editor.cancel();}else if(event.target.id==='textEditor'&&command&&event.key==='Enter'){event.preventDefault();editor.commit();}return;}
        if(event.altKey&&!command){const name=({f:'file',e:'edit',v:'view',i:'image',c:'colors',h:'help'})[key];if(name){event.preventDefault();openMenu(name,true);}return;}
        if(command){
            const action=event.shiftKey?({s:'saveAs',z:'redo',n:'clear',x:'crop'})[key]:({n:'new',o:'open',s:'save',z:'undo',y:'redo',x:'cut',c:'copy',a:'selectAll',r:'rotate',w:'stretch',i:'invert',e:'attributes',p:'print',g:'grid',t:'tools',l:'colors',f:'bitmap',pageup:'zoomNormal',pagedown:'zoomLarge'})[key];
            if(action){event.preventDefault();closeMenus();run(()=>perform(action));}return;
        }
        if(event.key==='F1'){event.preventDefault();run(help);}
        else if(event.key==='Escape'){if(menuPath.length)closeMenus(true);else editor.cancel();event.preventDefault();}
        else if(['Delete','Backspace'].includes(event.key)&&editor.getState().hasSelection){event.preventDefault();editor.deleteSelection();}
        else if(event.key==='Enter'&&!event.target.closest('button')){editor.commit();event.preventDefault();}
        else if(event.key.startsWith('Arrow')&&editor.getState().hasSelection&&!menuPath.length){const step=event.shiftKey?10:1;editor.nudgeSelection(event.key==='ArrowLeft'?-step:event.key==='ArrowRight'?step:0,event.key==='ArrowUp'?-step:event.key==='ArrowDown'?step:0);event.preventDefault();}
    });
    window.addEventListener('beforeunload',event=>{if(editor.getState().dirty||editor.getState().textEditing){event.preventDefault();event.returnValue='';}});
    $('minimizeBtn').addEventListener('click',()=>{closeMenus();$('paintWindow').hidden=true;$('restoreApp').hidden=false;$('restoreApp').focus();});
    $('restoreApp').addEventListener('click',()=>{$('paintWindow').hidden=false;$('restoreApp').hidden=true;});
    const maximize=()=>{$('paintWindow').classList.toggle('windowed');const restored=$('paintWindow').classList.contains('windowed');$('maximizeBtn').title=restored?'Maximize':'Restore Down';$('maximizeBtn').setAttribute('aria-label',restored?'Maximize':'Restore Down');};
    $('maximizeBtn').addEventListener('click',maximize);document.querySelector('.title-bar').addEventListener('dblclick',event=>{if(!event.target.closest('button'))maximize();});
    $('closeBtn').addEventListener('click',()=>run(()=>perform('exit')));
    $('reopenApp').addEventListener('click',()=>{$('closedScreen').hidden=true;$('paintWindow').hidden=false;documentGeneration++;editor.newDocument();filename='untitled';format='png';render(editor.getState());});
    render(editor.getState());
    report('For Help, click Help Topics on the Help Menu.');
})();
